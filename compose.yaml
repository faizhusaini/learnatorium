name: learnatorium
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnatorium}
      POSTGRES_USER: ${POSTGRES_USER:-learnatorium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnatorium-local}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-learnatorium}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-learnatorium-local-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  api:
    build: { context: ./apps/api }
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-learnatorium}
      DB_USERNAME: ${POSTGRES_USER:-learnatorium}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-learnatorium-local}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-development-secret-change-this}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: { context: ./apps/web }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
  minio-data:

