spring:
  application.name: learnatorium-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learnatorium}
    username: ${DB_USERNAME:learnatorium}
    password: ${DB_PASSWORD:learnatorium-local}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
server:
  error.include-message: never
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
springdoc:
  api-docs.path: /api-docs
app:
  auth:
    issuer: learnatorium
    access-token-ttl: PT10M
    refresh-token-ttl: P30D
    jwt-secret: ${AUTH_JWT_SECRET:local-development-secret-change-this}

